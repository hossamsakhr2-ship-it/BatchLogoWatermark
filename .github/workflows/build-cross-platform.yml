name: Build Batch Logo Watermark

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build-windows:
    name: Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow customtkinter gdown arabic-reshaper python-bidi pyinstaller

      - name: Build EXE
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --icon=app.ico --name BatchLogoWatermark batch_logo_watermark_cross_platform.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: BatchLogoWatermark-Windows
          path: dist/BatchLogoWatermark.exe


  build-macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow customtkinter gdown arabic-reshaper python-bidi pyinstaller

      - name: Build macOS app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --noupx \
            --name BatchLogoWatermark \
            batch_logo_watermark_cross_platform.py

          ditto -c -k --sequesterRsrc --keepParent \
            dist/BatchLogoWatermark.app \
            BatchLogoWatermark-macOS-arm64.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: BatchLogoWatermark-macOS-arm64
          path: BatchLogoWatermark-macOS-arm64.zip


  build-macos-intel:
    name: macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow customtkinter gdown arabic-reshaper python-bidi pyinstaller

      - name: Build macOS app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --noupx \
            --name BatchLogoWatermark \
            batch_logo_watermark_cross_platform.py

          ditto -c -k --sequesterRsrc --keepParent \
            dist/BatchLogoWatermark.app \
            BatchLogoWatermark-macOS-intel.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: BatchLogoWatermark-macOS-intel
          path: BatchLogoWatermark-macOS-intel.zip
